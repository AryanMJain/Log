<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="theme-color" content="#F2F4F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Lift</title>
<style>
:root{
  --bg:#F2F4F5;--card:#FFFFFF;--ink:#111827;--ink2:#6B7280;--ink3:#9CA3AF;--line:#E5E7EB;--field:#F3F4F6;
  --teal:#0F766E;--teal-ink:#FFFFFF;--tint:#E6F4F1;--ok:#15803D;--oktint:#DCFCE7;--warn:#B45309;--warntint:#FEF3C7;
  --blue:#2563EB;--violet:#7C3AED;--amber:#D97706;
  --r:16px;--ease:cubic-bezier(.23,1,.32,1);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#161A1D;--ink:#F3F4F6;--ink2:#9CA3AF;--ink3:#6B7280;--line:#2A3035;--field:#22282C;
  --teal:#2DD4BF;--teal-ink:#052E2B;--tint:#0F2A27;--ok:#4ADE80;--oktint:#0F2E1A;--warn:#FBBF24;--warntint:#3A2A05;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation;overscroll-behavior-y:none}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
button{font-family:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}button{transition:transform 160ms var(--ease),background-color 160ms ease,color 160ms ease}
input{font-family:inherit;font-size:17px;color:var(--ink);background:var(--field);border:none;border-radius:12px;outline:none;-webkit-appearance:none;appearance:none;font-variant-numeric:tabular-nums}
input:focus{box-shadow:0 0 0 2px var(--teal)}
input::placeholder{color:var(--ink3)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
/* header */
.hdr{position:sticky;top:0;z-index:8;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:calc(10px + env(safe-area-inset-top)) 0 8px}
.hdr .wrap{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hdr h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
.hdr .sub{font-size:14px;color:var(--ink2);margin-top:3px;font-variant-numeric:tabular-nums}
.hdr .act{font-size:16px;font-weight:600;color:var(--teal);padding:8px 0;white-space:nowrap}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 4px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;background:var(--card);font-weight:600;font-size:15px;color:var(--ink2);border:1px solid var(--line)}
.chip.on{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.chip .next{font-size:11px;font-weight:700;margin-left:6px;opacity:.8}
/* cards */
.card{background:var(--card);border-radius:var(--r);padding:14px 14px 10px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card.done{padding:12px 14px}
.card.done .ex-name{font-size:15px}
.done-row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left}
.done-row .sum{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;margin-top:2px}
.done-row .ok{color:var(--ok);flex:none;width:22px;height:22px}
.same{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--teal);background:var(--tint);padding:8px 12px;border-radius:999px;margin-top:8px}
.warm{display:flex;gap:8px;margin-top:8px}
.warm button{flex:1;padding:10px 6px;border-radius:12px;background:var(--field);font-size:13px;font-weight:600;color:var(--ink2);line-height:1.2}
.warm button.on{background:var(--tint);color:var(--teal);box-shadow:inset 0 0 0 1.5px var(--teal)}
.strip{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border-radius:var(--r);padding:10px 14px;margin:10px 0 2px}
.strip .days{display:flex;gap:6px}
.strip .dd{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--ink3)}
.strip .dd i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.strip .dd i.on{background:var(--teal)}.strip .dd.today{color:var(--teal)}
.strip .cnt{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.strip .cnt small{color:var(--ink2);font-weight:500}
.sun{display:flex;gap:8px;margin-top:10px;align-items:center}
.sun input{flex:1;padding:12px;text-align:center}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-name{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.ex-name .star{color:var(--teal)}
.ex-meta{font-size:13px;color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
.tag{font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;white-space:nowrap;flex:none}
.tag.up{background:var(--oktint);color:var(--ok)}
.tag.fn{background:var(--tint);color:var(--teal)}
.ss-lbl{font-size:12px;font-weight:700;color:var(--teal);letter-spacing:.04em;text-transform:uppercase;margin:16px 0 -6px 4px}
.ss-wrap{border-left:3px solid var(--teal);margin-left:-16px;padding-left:13px}
.ss-wrap .card{margin-left:0}
/* set rows */
.cols{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 4px;text-align:center}
.set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center;padding:4px 0}
.set .num{font-size:14px;font-weight:600;color:var(--ink2);text-align:center;font-variant-numeric:tabular-nums}
.set .last{font-size:10px;color:var(--ink3);display:block;font-weight:500}
.step{display:flex;align-items:center;background:var(--field);border-radius:12px;height:46px;overflow:hidden}
.step button{width:40px;height:46px;font-size:22px;color:var(--teal);font-weight:500;flex:none;display:flex;align-items:center;justify-content:center}
.step button:active{background:var(--line)}
.step input{flex:1;min-width:0;height:46px;background:none;text-align:center;font-size:18px;font-weight:600;padding:0;border-radius:0}
.step input:focus{box-shadow:none;background:var(--card)}
.step.empty input{color:var(--ink3);font-weight:500}
.tick{width:44px;height:46px;border-radius:12px;background:var(--field);display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.tick.on{background:var(--teal);color:var(--teal-ink)}
.tick svg{width:22px;height:22px}
.set.done .step{opacity:.6}
.prog{height:4px;background:var(--line);border-radius:2px;margin:6px 0 2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--teal);border-radius:2px;transition:width 240ms var(--ease)}
.hint{font-size:13px;color:var(--ink2);line-height:1.45;margin:6px 0}
.note{width:100%;padding:12px 14px;margin-top:6px}
/* bottom bars */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:9;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs{display:flex;max-width:560px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;font-weight:600;color:var(--ink3)}
.tab.on{color:var(--teal)}
.tab svg{width:26px;height:26px}
.tab:active{transform:none}
.bar{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.bar .t{font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink2);font-weight:600}
.bar .t.over{color:var(--warn)}
.bar .rest{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800;color:var(--teal);letter-spacing:-.02em}
.bar .grow{flex:1}
.btn{background:var(--teal);color:var(--teal-ink);border-radius:999px;padding:12px 20px;font-size:16px;font-weight:700}
.btn.ghost{background:var(--field);color:var(--ink)}
.btn.wide{display:block;width:100%;padding:15px;border-radius:14px}
.btn.danger{background:var(--warntint);color:var(--warn)}
/* today card / calendar */
.today{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hab{display:flex;align-items:center;gap:10px;padding:14px 12px;border-radius:14px;background:var(--field);font-weight:600;font-size:15px;color:var(--ink2);min-height:56px}
.hab .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:#fff;transition:background-color 160ms ease,border-color 160ms ease}
.hab .dot svg{width:14px;height:14px;opacity:0;transform:scale(.6);transition:opacity 160ms var(--ease),transform 200ms var(--ease)}
.hab.on{color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1.5px var(--c)}
.hab.on .dot{background:var(--c);border-color:var(--c)}
.hab.on .dot svg{opacity:1;transform:scale(1)}
.calhead{display:flex;justify-content:space-between;align-items:center;margin:6px 0 4px}
.calhead b{font-size:17px}
.calhead button{font-size:26px;color:var(--teal);padding:2px 12px;line-height:1}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{font-size:11px;color:var(--ink3);text-align:center;font-weight:600;padding-bottom:2px}
.day{aspect-ratio:1/1.05;border-radius:12px;background:var(--field);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%}
.day.empty{background:none}
.day.future{opacity:.35}
.day.sel{box-shadow:inset 0 0 0 2px var(--teal)}
.day.today .d{color:var(--teal)}
.day .d{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--c)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink2);margin:10px 0 0;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%}
.wk{display:grid;grid-template-columns:56px repeat(4,1fr);gap:4px;font-size:14px;padding:8px 0;border-top:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
.wk.h{color:var(--ink3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;border-top:none}
.wk .hit{color:var(--ok);font-weight:700}.wk .miss{color:var(--ink3)}
.stat{background:var(--tint);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.5;margin:10px 0}
.stat b{font-variant-numeric:tabular-nums}
.big{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:8px 0}
.big .n{font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--teal);font-variant-numeric:tabular-nums}
.big .l{font-size:11px;color:var(--ink2);font-weight:600}
.tgt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tgt label{font-size:11px;color:var(--ink2);text-align:center;font-weight:600}
.tgt input{width:100%;text-align:center;padding:10px 4px;margin-top:4px;font-weight:700}
h2{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:18px 0 6px}
h3{font-size:13px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 6px}
.sess{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.sess:first-child{border-top:none}
.sess .r{color:var(--ink2);font-size:14px}
.sessbody{font-size:13px;color:var(--ink2);padding:0 0 10px;line-height:1.7}
details summary{list-style:none}details summary::-webkit-details-marker{display:none}
.spark{width:100%;height:56px;display:block;margin-top:8px}
.frow{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px;margin:8px 0}
.frow input{padding:12px 6px;text-align:center;min-width:0;width:100%}
textarea{width:100%;font-family:inherit;font-size:12px;border:none;background:var(--field);border-radius:12px;padding:10px;height:72px;color:var(--ink2);margin-top:8px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-8px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:30;opacity:0;pointer-events:none;transition:opacity 160ms ease,transform 200ms var(--ease)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ptot{text-align:center;margin:6px 0 2px}
.ptot .pn{font-size:56px;font-weight:800;letter-spacing:-.03em;color:var(--blue);font-variant-numeric:tabular-nums;line-height:1}
.ptot .pn.hit{color:var(--ok)}
.ptot .pu{font-size:18px;color:var(--ink2);font-weight:600;margin-left:4px}
.pbar{position:relative;height:10px;background:var(--line);border-radius:5px;margin:12px 0 4px}
.pbar i{display:block;height:100%;background:var(--blue);border-radius:5px;transition:width 240ms var(--ease)}
.pbar span{position:absolute;top:-4px;width:2px;height:18px;background:var(--ink2);border-radius:1px}
.padd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 8px}
.padd button{height:64px;border-radius:14px;background:var(--tint);color:var(--teal);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.pcus{display:flex;gap:8px;margin-bottom:6px}
.pcus input{flex:1;min-width:0;padding:12px 14px}
.pdel{font-size:22px;color:var(--ink3);width:36px;height:32px}
.p7{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:112px;margin:12px 0 26px}
.p7c{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.p7c i{display:block;width:70%;border-radius:6px 6px 2px 2px;min-height:2px}
.p7v{font-size:10px;color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums;margin-bottom:2px}
.p7d{position:absolute;bottom:-18px;font-size:11px;color:var(--ink3);font-weight:600}
.p7t{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ok);opacity:.6;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="hdr"><div class="wrap" id="hdr"></div></div>
<div class="wrap" id="view"></div>
<div class="dock"><div id="bar"></div><div class="tabs" id="tabs"></div></div>
<div class="toast" id="toast"></div>

<script>
// ================= PLAN (5 days · 2 hard sets · 30–40 min) =================
// Superset rule: first exercise's rest = rest between the pair; last one's rest = rest after the round.
const PLAN=[
 {id:"a1",short:"Day 1",name:"Chest + Back + Squat",mins:35,ex:[
  {n:"Smith incline press",sets:2,lo:6,hi:8,star:1,ss:"A",rest:75,cue:"Ramp first: 50%×8, 75%×3. Bench ~30°."},
  {n:"Lat pulldown",sets:2,lo:6,hi:8,star:1,ss:"A",rest:90,cue:"Wide grip. Ramp 1 set first."},
  {n:"Seated DB shoulder press",sets:2,lo:8,hi:10,ss:"B",rest:60},
  {n:"Cable row",sets:2,lo:8,hi:10,ss:"B",rest:90,cue:"Chest up, don't lean back."},
  {n:"Smith squat",sets:2,lo:5,hi:8,star:1,rest:150,cue:"Leg move. Ramp 1 set. Stop 1–2 reps short."},
  {n:"Standing calf raise",sets:2,lo:10,hi:15,ss:"C",rest:0,cue:"Full pause at the bottom."},
  {n:"Hanging leg raise",sets:2,lo:8,hi:15,noKg:1,ss:"C",rest:60,cue:"Slow down, no swinging."},
 ]},
 {id:"a2",short:"Day 2",name:"Shoulders + Arms + Lunge",mins:30,ex:[
  {n:"Cable lateral raise",sets:2,lo:12,hi:15,ss:"A",rest:0},
  {n:"Cable face pull",sets:2,lo:12,hi:15,ss:"A",rest:60},
  {n:"DB curl",sets:2,lo:8,hi:12,ss:"B",rest:0},
  {n:"Cable pushdown",sets:2,lo:8,hi:12,ss:"B",rest:60},
  {n:"Hammer curl",sets:2,lo:10,hi:12,ss:"C",rest:0},
  {n:"Overhead cable extension",sets:2,lo:10,hi:12,ss:"C",rest:60},
  {n:"Walking DB lunge",sets:2,lo:10,hi:12,rest:75,cue:"Leg move. Each leg."},
  {n:"Cable crunch",sets:2,lo:10,hi:15,ss:"D",rest:0,cue:"Round the spine, hips still."},
  {n:"Suitcase carry",sets:2,unit:"m",step:10,lo:40,hi:40,kgLabel:"kg",ss:"D",fn:1,rest:60,cue:"Each hand. Don't let the torso tip."},
 ]},
 {id:"a3",short:"Day 3",name:"Press + Pull + Hinge",mins:34,ex:[
  {n:"Smith flat press",sets:2,lo:6,hi:8,ss:"A",rest:75,cue:"Ramp first: 50%×8, 75%×3."},
  {n:"Pull-ups",sets:2,lo:0,hi:0,kgLabel:"assist",ss:"A",rest:90,cue:"Go to 0–1 reps left."},
  {n:"Barbell Romanian deadlift",sets:2,lo:6,hi:8,star:1,rest:120,cue:"Leg move — done before rows so grip is fresh. Stop 1–2 short."},
  {n:"Smith overhead press",sets:2,lo:6,hi:8,ss:"B",rest:60},
  {n:"Single-arm DB row",sets:2,lo:8,hi:10,ss:"B",rest:90,cue:"Each side."},
  {n:"Cable lateral raise",sets:2,lo:12,hi:15,ss:"C",rest:0},
  {n:"Pallof press",sets:2,lo:12,hi:12,fn:1,ss:"C",rest:45,cue:"Each side. Press out, hold 2 s."},
 ]},
 {id:"a4",short:"Day 4",name:"Chest + Back + Split squat",mins:31,ex:[
  {n:"DB incline press",sets:2,lo:8,hi:10,ss:"A",rest:60,cue:"Ramp 1 set first."},
  {n:"Close-grip lat pulldown",sets:2,lo:10,hi:12,ss:"A",rest:75},
  {n:"Cable fly",sets:2,lo:12,hi:15,ss:"B",rest:0},
  {n:"Straight-arm pulldown",sets:2,lo:12,hi:15,ss:"B",rest:60},
  {n:"Bulgarian split squat",sets:2,lo:8,hi:10,rest:90,cue:"Leg move. Each leg. Rear foot on bench."},
  {n:"Seated calf raise",sets:2,lo:12,hi:15,ss:"C",rest:0},
  {n:"Cable woodchop",sets:2,lo:12,hi:12,fn:1,ss:"C",rest:45,cue:"Each side. Turn through the hips."},
 ]},
 {id:"a5",short:"Day 5",name:"Back + Delts + Hips",mins:30,ex:[
  {n:"Cable row, wide grip",sets:2,lo:10,hi:12,ss:"A",rest:0},
  {n:"Cable lateral raise",sets:2,lo:12,hi:15,ss:"A",rest:60},
  {n:"Seated DB shoulder press",sets:2,lo:8,hi:10,ss:"B",rest:60},
  {n:"Cable face pull",sets:2,lo:12,hi:15,ss:"B",rest:60},
  {n:"Hip thrust",sets:2,lo:8,hi:10,rest:90,cue:"Leg move. Pad the bar, chin tucked, pause at top."},
  {n:"DB curl",sets:2,lo:8,hi:12,ss:"C",rest:0},
  {n:"Hanging leg raise",sets:2,lo:8,hi:15,noKg:1,ss:"C",rest:60},
 ]},
 {id:"int",short:"Intervals",name:"Intervals (optional)",mins:16,ex:[
  {n:"Bike or hill · 30 s hard / 90 s easy",sets:1,unit:"rounds",lo:8,hi:8,kgLabel:"mins",fn:1,rest:0},
 ]},
];
const ORDER=["a1","a2","a3","a4","a5"];
// Old plan names so history from before the switch still displays
const LEGACY={d1:{short:"Old Day 1",name:"Push + Quads"},d2:{short:"Old Day 2",name:"Pull + Hips"},d3:{short:"Old Day 3",name:"Push + Quads"},d4:{short:"Old Day 4",name:"Pull + Hips"},u1:{short:"Upper A",name:"Chest + Back"},l1:{short:"Lower A",name:"Squat + Hinge"},u2:{short:"Upper B",name:"Press + Pull"},l2:{short:"Lower B",name:"Single-leg"},u3:{short:"Upper C",name:"Arms + Shoulders"}};
const dayInfo=id=>PLAN.find(d=>d.id===id)||LEGACY[id]||{short:id,name:""};
const CAP=40; // minutes before the timer turns amber
const HABITS=[["gym","Gym","var(--teal)"],["protein","Protein","var(--blue)"],["sleep","Sleep 7h+","var(--violet)"],["diet","Diet on plan","var(--amber)"]];
const ICON={check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
 log:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6M8 6v12M16 6v12M20 9v6M8 12h8"/></svg>',

// Protein
const pList=d=>DB.protein[d]||[];
const pTotal=d=>pList(d).reduce((a,x)=>a+Number(x.g||0),0);

let W=DB.draft&&DB.draft.date===today()&&PLAN.some(d=>d.id===DB.draft.day)?DB.draft:null; // in-progress workout
if(!W)W=newWorkout(nextDay());
function newWorkout(dayId){const day=PLAN.find(d=>d.id===dayId);const ex={};
  day.ex.forEach(e=>{const prev=lastEx(e.n);ex[e.n]={sets:Array.from({length:e.sets},(_,i)=>{const ps=prev?.sets?.[i];return{k:ps?.k??"",r:ps?.r??"",d:false}})}});
  return{day:dayId,date:today(),ex,note:"",start:null,warm:[false,false,false]}}
if(!W.warm)W.warm=[false,false,false];
let expanded=new Set(),scrollTo=null;
function draft(){DB.draft=W;save()}
let restEnd=null,restH=null,wake=null,actx=null;

function primeAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}}
function beep(){try{if(!actx)return;const t=actx.currentTime;[0,.18,.36].forEach(o=>{const g=actx.createGain(),osc=actx.createOscillator();osc.type="sine";osc.frequency.value=880;g.gain.setValueAtTime(0,t+o);g.gain.linearRampToValueAtTime(.4,t+o+.02);g.gain.exponentialRampToValueAtTime(.001,t+o+.15);osc.connect(g);g.connect(actx.destination);osc.start(t+o);osc.stop(t+o+.16)})}catch(e){}}

// ================= LOG =================
function renderHdr(){
  if(tab==="log"){const day=PLAN.find(d=>d.id===W.day);return`<div><h1>${day.name}</h1><div class="sub"><span id="elapsed">${W.start?mmss(Math.floor((Date.now()-W.start)/1000)):"Not started"}</span> · budget ${day.mins} min · <button data-act="date" style="color:var(--teal);font-weight:600">${fmt(W.date)}</button></div></div><button class="act" data-act="finish">Finish</button>`}
  if(tab==="prot")return`<div><h1>Protein</h1><div class="sub">Target ${DB.ptarget} g · counts as a hit at ${DB.phit} g</div></div>`;
  if(tab==="cal")return`<div><h1>Consistency</h1><div class="sub">Four things a day. That's the whole game.</div></div>`;
  return`<div><h1>Progress</h1><div class="sub">Top-set lifts, body, history</div></div>`;
}
function renderLog(){
  const day=PLAN.find(d=>d.id===W.day),nd=nextDay(),anyPrev=day.ex.some(e=>lastEx(e.n));
  let h=`<div class="chips">${PLAN.map(d=>`<button class="chip ${d.id===W.day?"on":""}" data-day="${d.id}">${d.short}${d.id===nd&&d.id!==W.day?'<span class="next">NEXT</span>':""}</button>`).join("")}</div>`;

  const total=day.ex.reduce((a,e)=>a+e.sets,0),done=day.ex.reduce((a,e)=>a+W.ex[e.n].sets.filter(s=>s.d).length,0);

  if(W.day!=="int")h+=`<div class="hint"><b>2 hard sets.</b> Set 1: 1–2 reps left. Set 2: 0–1 left. Could do 4 more? It didn't count.</div>`;
  if(W.day!=="int"){const WU=["2 min mobility","Ramp 50% × 8","Ramp 75% × 3"];const wn=W.warm.filter(Boolean).length;
    h+=`<div class="card ${wn===3?"done":""}"><div class="ex-head"><div><div class="ex-name">Warm-up</div><div class="ex-meta">5 min · ramp sets on the first lift${wn===3?" · done":""}</div></div>${wn===3?`<svg class="ok" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M5 12.5l4.5 4.5L19 7"/></svg>`:""}</div>${wn===3?"":`<div class="warm">${WU.map((t,i)=>`<button class="${W.warm[i]?"on":""}" data-warm="${i}">${t}</button>`).join("")}</div>`}</div>`}
  let open=null;
  day.ex.forEach((e,i)=>{
    const p=lastEx(e.n),up=topped(e,p),w=W.ex[e.n],allDone=w.sets.every(s=>s.d);
    if(e.ss&&e.ss!==open){if(open)h+=`</div>`;open=e.ss;const m=day.ex.filter(x=>x.ss===e.ss),btw=m[0].rest||0,aft=m[m.length-1].rest||60;
      h+=`<div class="ss-lbl">Superset · ${btw?btw+" s between":"no rest between"} · ${aft} s after</div><div class="ss-wrap">`}
    if(!e.ss&&open){h+=`</div>`;open=null}
    if(allDone&&!expanded.has(i)){const sum=w.sets.map(x=>`${x.k!==""&&!e.noKg?x.k+"×":""}${x.r}`).join(" · ");

    ${canSame?`<button class="same" data-same="${i}">${ICON.check.replace('<svg','<svg width="14" height="14"')} Same as last time</button>`:""}
    <div class="cols"><span>Set</span><span>${e.noKg?"":(e.kgLabel||"kg")}</span><span>${e.unit||"reps"}</span><span></span></div>`;
    w.sets.forEach((s,j)=>{const ps=p?.sets?.[j];const last=ps&&(ps.k!==""||ps.r!=="")?`${ps.k!==""?ps.k+"×":""}${ps.r}`:"";

      <div class="step ${s.r===""?"empty":""}"><button data-st="r" data-i="${i}" data-j="${j}" data-v="-1">−</button><input inputmode="numeric" data-in="r" data-i="${i}" data-j="${j}" value="${s.r}" placeholder="${ps?.r??"–"}"><button data-st="r" data-i="${i}" data-j="${j}" data-v="1">+</button></div>
      <button class="tick ${s.d?"on":""}" data-tick="${i}" data-j="${j}" aria-label="set done">${ICON.check}</button></div>`});

  });

  <div style="height:8px"></div><button class="btn wide" data-act="finish">Finish workout</button>

function stepVal(e,kind,cur,dir){const c=cur===""?null:Number(cur);const stepK=e.n.toLowerCase().includes("db")||e.n.toLowerCase().includes("dumbbell")?1:2.5;
  if(kind==="k")return c===null?(dir>0?stepK*4:""):Math.max(0,Math.round((c+dir*stepK)*100)/100);
  const st=e.step||1;return c===null?(dir>0?(e.lo||st*8):""):Math.max(0,c+dir*st)}
function tickSet(i,j){const day=PLAN.find(d=>d.id===W.day),e=day.ex[i],s=W.ex[e.n].sets[j],prev=lastEx(e.n);
  if(!s.d){ // fill blanks from previous set or last session before marking done
    const from=j>0?W.ex[e.n].sets[j-1]:null,ps=prev?.sets?.[j];
    if(s.k===""&&!e.noKg)s.k=from?.k??ps?.k??"";if(s.r==="")s.r=from?.r??ps?.r??"";
    if(!W.start)W.start=Date.now();primeAudio();keepAwake();
    // next set inherits values if blank
    const nx=W.ex[e.n].sets[j+1];if(nx&&nx.k===""&&nx.r===""){nx.k=s.k;nx.r=s.r}
    s.d=true;const rest=e.rest??75;if(rest>0)startRest(rest);else stopRest();
    scrollTo=nextOpen(i,j);
  }else{s.d=false;expanded.add(i)}
  draft();render();
}
function nextOpen(i,j){const day=PLAN.find(d=>d.id===W.day);for(let a=i;a<day.ex.length;a++){const w=W.ex[day.ex[a].n];for(let b=(a===i?j+1:0);b<w.sets.length;b++)if(!w.sets[b].d)return`s-${a}-${b}`}return null}
function sameAsLast(i){const day=PLAN.find(d=>d.id===W.day),e=day.ex[i],p=lastEx(e.n);if(!p)return;
  W.ex[e.n].sets.forEach((s,j)=>{const ps=p.sets[j];if(ps){s.k=e.noKg?"":ps.k;s.r=ps.r}s.d=true});
  if(!W.start)W.start=Date.now();primeAudio();keepAwake();const rest=e.rest??75;if(rest>0)startRest(rest);
  scrollTo=nextOpen(i,W.ex[e.n].sets.length-1);draft();render()}
function startRest(sec){restEnd=Date.now()+sec*1000;clearInterval(restH);restH=setInterval(tickRest,250);renderBar();tickRest()}
function stopRest(){restEnd=null;clearInterval(restH);renderBar()}
function tickRest(){if(!restEnd)return;const left=Math.ceil((restEnd-Date.now())/1000);const el=$("#restT");if(el)el.textContent=mmss(Math.max(0,left));if(left<=0){stopRest();beep();toast("Rest over — go")}
  const e2=$("#elapsed");if(e2&&W.start){const s=Math.floor((Date.now()-W.start)/1000);e2.textContent=mmss(s);e2.style.color=s>=CAP*60?"var(--warn)":""}}
setInterval(()=>{const e2=$("#elapsed");if(e2&&W.start&&!restEnd){const s=Math.floor((Date.now()-W.start)/1000);e2.textContent=mmss(s);e2.style.color=s>=CAP*60?"var(--warn)":""}},1000);
function finish(){const day=PLAN.find(d=>d.id===W.day);const ex={};let any=0;
  day.ex.forEach(e=>{ex[e.n]={sets:W.ex[e.n].sets.map(s=>{if(s.k!==""||s.r!=="")any++;return{k:s.k===""?"":Number(s.k),r:s.r===""?"":Number(s.r)}})}});
  if(!any)return toast("Nothing logged yet");
  const mins=W.start?Math.max(1,Math.round((Date.now()-W.start)/60000)):null;
  DB.sessions=DB.sessions.filter(s=>!(s.day===W.day&&s.date===W.date));
  DB.sessions.push({id:W.day+"-"+W.date,day:W.day,date:W.date,ex,note:W.note,mins});
  if(W.day!=="int"){DB.days[W.date]=DB.days[W.date]||{};DB.days[W.date].gym=true;DB.lastDay=W.day}
  DB.draft=null;stopRest();releaseAwake();expanded=new Set();W=newWorkout(nextDay());save();toast(`Saved · ${mins?mins+" min":"done"}`);render();
}

  h+=`<div class="card"><div class="calhead"><button data-nav="-1">‹</button><b>${first.toLocaleDateString("en-GB",{month:"long",year:"numeric"})}</b><button data-nav="1">›</button></div>
  <div class="grid">${["M","T","W","T","F","S","S"].map(d=>`<div class="dow">${d}</div>`).join("")}${"<div class='day empty'></div>".repeat(lead)}`;
  for(let d=1;d<=n;d++){const s=`${calMonth}-${String(d).padStart(2,"0")}`,dv=DB.days[s]||{};
    h+=`<button class="day ${s===t?"today":""} ${s>t?"future":""} ${s===selDay?"sel":""}" data-sel="${s}"><span class="d">${d}</span><span class="dots">${HABITS.map(([k,,c])=>`<i class="${dv[k]?"on":""}" style="--c:${c}"></i>`).join("")}</span></button>`}
  h+=`</div><div class="legend">${HABITS.map(([,l,c])=>`<span><i style="background:${c}"></i>${l}</span>`).join("")}</div></div>`;
  // 13-week summary
  const T=DB.targets,weeks=[];let mon=mondayOf(t);for(let i=0;i<13;i++){weeks.push(mon);const d=new Date(mon+"T00:00");d.setDate(d.getDate()-7);mon=iso(d)}
  const stats=weeks.map(w=>{const c={gym:0,protein:0,sleep:0,diet:0};let any=false;for(let i=0;i<7;i++){const d=new Date(w+"T00:00");d.setDate(d.getDate()+i);const dv=DB.days[iso(d)];if(dv){any=true;HABITS.forEach(([k])=>{if(dv[k])c[k]++})}}return{w,c,any}});
  const act=stats.filter(s=>s.any),hit=k=>act.filter(s=>s.c[k]>=T[k]).length;
  h+=`<div class="card"><b style="font-size:17px">Last 13 weeks</b><div class="hint">Weeks that hit the target, out of ${act.length} logged.</div>
  <div class="big">${HABITS.map(([k,l])=>`<div><div class="n">${act.length?hit(k):"–"}<span style="font-size:14px;color:var(--ink3)">/${act.length||13}</span></div><div class="l">${l.split(" ")[0]} ${T[k]}+</div></div>`).join("")}</div>
  <div class="wk h"><div>Week</div><div>Gym</div><div>Prot</div><div>Sleep</div><div>Diet</div></div>
  ${stats.map(s=>`<div class="wk"><div style="text-align:left;color:var(--ink2);font-size:13px">${fmt(s.w)}</div>${HABITS.map(([k])=>`<div class="${s.any&&s.c[k]>=T[k]?"hit":"miss"}">${s.any?s.c[k]:"·"}</div>`).join("")}</div>`).join("")}
  <h3>Weekly targets (days)</h3><div class="tgt">${HABITS.map(([k,l])=>`<label>${l.split(" ")[0]}<input inputmode="numeric" data-tgt="${k}" value="${T[k]}"></label>`).join("")}</div></div>`;
  return h;
}

// ================= PROGRESS =================
function spark(vals){if(vals.length<2)return"";const w=300,hh=56,mx=Math.max(...vals),mn=Math.min(...vals),rg=mx-mn||1;const pts=vals.map((v,i)=>[i/(vals.length-1)*(w-8)+4,hh-6-(v-mn)/rg*(hh-14)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");const l=pts[pts.length-1];
  return`<svg class="spark" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${l[0]}" cy="${l[1]}" r="4" fill="var(--teal)"/></svg>`}
function renderProg(){
  const stars=PLAN.flatMap(d=>d.ex.filter(e=>e.star));
  let h=`<div class="hint" style="margin-top:8px">Est. 1RM = kg × (1 + reps ÷ 30) from your best set. Rises when you add reps or weight. History carries over from the old 4-day plan.</div>`;
  stars.forEach(e=>{const hist=DB.sessions.filter(s=>s.ex?.[e.n]).map(s=>{const b=s.ex[e.n].sets.filter(x=>x.k!==""&&x.r!=="").map(x=>({...x,e:e1rm(x.k,x.r)})).sort((a,b)=>b.e-a.e)[0];return b?{date:s.date,...b}:null}).filter(Boolean).sort((a,b)=>a.date<b.date?-1:1);
    const f=hist[0],l=hist[hist.length-1],pct=f&&l&&hist.length>1?Math.round((l.e/f.e-1)*100):null;
    h+=`<div class="card"><div class="ex-head"><div><div class="ex-name">${esc(e.n)}</div><div class="ex-meta">${hist.length?`Latest ${l.k} kg × ${l.r} · est. ${l.e}`:"No sessions yet"}</div></div>${pct!==null?`<span class="tag ${pct>=0?"up":""}" style="${pct<0?"background:var(--warntint);color:var(--warn)":""}">${pct>0?"+":""}${pct}%</span>`:""}</div>${spark(hist.map(x=>x.e))}</div>`});
  const ws=[...DB.weekly].sort((a,b)=>a.date<b.date?-1:1),f=ws[0],l=ws[ws.length-1];
  h+=`<div class="card"><b style="font-size:17px">Bodyweight & waist</b><div class="hint">Weight weekly (average of morning weigh-ins). Waist at navel monthly. Week 12: lifts up but waist not down 2 cm → carbs −250 kcal.</div>
  <div class="frow"><input type="date" id="wdate" value="${today()}" style="font-size:14px"><input inputmode="decimal" id="wbw" placeholder="kg"><input inputmode="decimal" id="wwaist" placeholder="waist cm"></div><button class="btn wide ghost" data-act="saveW">Save</button>`;
  if(f&&l&&f!==l){const dw=(Number(l.bw||0)-Number(f.bw||0)).toFixed(1),wz=ws.filter(x=>x.waist),wd=wz.length>1?(Number(wz[wz.length-1].waist)-Number(wz[0].waist)).toFixed(1):null;
    h+=`<div class="stat">Since ${fmt(f.date)}: weight <b>${dw>0?"+":""}${dw} kg</b>${wd!==null?` · waist <b style="color:${wd<=0?"var(--ok)":"var(--warn)"}">${wd>0?"+":""}${wd} cm</b>`:""}</div>`}
  h+=ws.slice().reverse().slice(0,6).map(w=>`<div class="sess"><span>${fmt(w.date)}</span><span class="r">${w.bw?w.bw+" kg":"—"} · ${w.waist?w.waist+" cm":"—"}</span></div>`).join("")+`</div>`;
  h+=`<div class="card"><b style="font-size:17px">Sessions</b>`;
  const ss=[...DB.sessions].sort((a,b)=>a.date<b.date?1:-1);if(!ss.length)h+=`<div class="hint">Nothing saved yet.</div>`;
  ss.forEach(s=>{const d=dayInfo(s.day);h+=`<details><summary class="sess"><span>${esc(d.short)}${d.name?` · ${esc(d.name)}`:""}${s.mins?` · ${s.mins} min`:""}</span><span class="r">${fmt(s.date)}</span></summary><div class="sessbody">${Object.keys(s.ex||{}).map(n=>{const v=s.ex[n];if(!v)return"";const st=v.sets.filter(x=>x.k!==""||x.r!=="").map(x=>`${x.k!==""?x.k+"×":""}${x.r}`).join(", ");return st?`<div>${esc(n)}: ${st}</div>`:""}).join("")}${s.note?`<div><i>${esc(s.note)}</i></div>`:""}<button class="chip" data-del="${s.id}" style="margin-top:8px;color:var(--warn)">Delete</button></div></details>`});
  h+=`</div><div class="card"><b style="font-size:17px">Backup</b><div class="hint">Copy into Notes once a month. Paste back and tap Restore if you change phone.</div><textarea id="bk" readonly>${esc(JSON.stringify(DB))}</textarea>
  <div class="frow" style="grid-template-columns:1fr 1fr"><button class="btn ghost wide" data-act="copy">Copy</button><button class="btn ghost wide" data-act="restore">Restore from pasted text</button></div><button class="btn wide danger" data-act="wipe" style="margin-top:8px">Clear everything</button></div>`;
  return h;
}

// ================= SHELL =================
function renderBar(){const b=$("#bar");if(tab!=="log"){b.innerHTML="";return}
  if(restEnd){b.innerHTML=`<div class="bar"><span style="font-size:13px;color:var(--ink2);font-weight:600">REST</span><span class="rest" id="restT">${mmss(Math.max(0,Math.ceil((restEnd-Date.now())/1000)))}</span><span class="grow"></span><button class="btn ghost" data-act="rest+">+30 s</button><button class="btn" data-act="skip">Skip</button></div>`}
  else b.innerHTML=``}
function render(){
  $("#hdr").innerHTML=renderHdr();
  $("#tabs").innerHTML=[["log","Log",ICON.log],["prot","Protein",ICON.prot],["cal","Calendar",ICON.cal],["prog","Progress",ICON.prog]].map(([k,l,i])=>`<button class="tab ${tab===k?"on":""}" data-tab="${k}">${i}${l}</button>`).join("");
  $("#view").innerHTML=tab==="log"?renderLog():tab==="prot"?renderProt():tab==="cal"?renderCal():renderProg();
  renderBar();
  if(scrollTo){const el=document.getElementById(scrollTo);scrollTo=null;if(el)requestAnimationFrame(()=>el.scrollIntoView({block:"center",behavior:"smooth"}))}
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.tab){tab=d.tab;window.scrollTo(0,0);render()}
  else if(d.day){if(d.day!==W.day){const has=Object.values(W.ex).some(x=>x.sets.some(s=>s.d));if(has&&!confirm("Switch day? Ticked sets on this workout will be kept as a draft only until you switch back."))return;W=newWorkout(d.day);expanded=new Set();draft();render()}}
  else if(d.st){const day=PLAN.find(x=>x.id===W.day),ex=day.ex[d.i],s=W.ex[ex.n].sets[d.j];s[d.st]=stepVal(ex,d.st,s[d.st],Number(d.v));draft();render()}
  else if(d.tick!==undefined)tickSet(Number(d.tick),Number(d.j));
  else if(d.same!==undefined)sameAsLast(Number(d.same));
  else if(d.expand!==undefined){expanded.add(Number(d.expand));render()}
  else if(d.warm!==undefined){W.warm[Number(d.warm)]=!W.warm[Number(d.warm)];if(!W.start&&W.warm.some(Boolean))W.start=Date.now();primeAudio();keepAwake();draft();render()}
  else if(d.act==="saveSun"){const bw=$("#sbw").value.trim(),waist=$("#swaist").value.trim();if(!bw&&!waist)return toast("Enter a number");DB.weekly=DB.weekly.filter(x=>x.date!==selDay);DB.weekly.push({date:selDay,bw,waist});save();toast("Saved");render()}
  else if(d.padd)pAdd(pDay,d.padd);
  else if(d.act==="pcus"){const el=$("#pcus");pAdd(pDay,el.value.trim())}
  else if(d.act==="pundo")pRemove(pDay,pList(pDay).length-1);
  else if(d.pdel!==undefined)pRemove(pDay,Number(d.pdel));
  else if(d.pnav){const x=new Date(pDay+"T00:00");x.setDate(x.getDate()+Number(d.pnav));const v=iso(x);if(v<=today()){pDay=v;render()}}
  else if(d.pday){pDay=d.pday;render()}
  else if(d.act==="finish")finish();
  else if(d.act==="discard"){if(confirm("Discard this workout?")){W=newWorkout(W.day);DB.draft=null;stopRest();releaseAwake();expanded=new Set();save();render()}}
  else if(d.act==="date"){const v=prompt("Session date (YYYY-MM-DD)",W.date);if(v&&/^\d{4}-\d{2}-\d{2}$/.test(v)){W.date=v;draft();render()}}
  else if(d.act==="skip")stopRest();
  else if(d.act==="rest+"){restEnd+=30000;tickRest()}
  else if(d.nav){const [y,m]=calMonth.split("-").map(Number);calMonth=iso(new Date(y,m-1+Number(d.nav),1)).slice(0,7);render()}
  else if(d.sel){selDay=d.sel;render()}
  else if(d.hab){const v=DB.days[selDay]=DB.days[selDay]||{};v[d.hab]=!v[d.hab];save();render()}
  else if(d.act==="saveW"){const dt=$("#wdate").value,bw=$("#wbw").value.trim(),waist=$("#wwaist").value.trim();if(!bw&&!waist)return toast("Enter a number");DB.weekly=DB.weekly.filter(x=>x.date!==dt);DB.weekly.push({date:dt,bw,waist});save();toast("Saved");render()}
  else if(d.del){if(confirm("Delete this session?")){DB.sessions=DB.sessions.filter(s=>s.id!==d.del);save();render()}}
  else if(d.act==="copy"){navigator.clipboard?.writeText(JSON.stringify(DB)).then(()=>toast("Copied")).catch(()=>{$("#bk").select();toast("Select all, then copy")})}
  else if(d.act==="restore"){const ta=$("#bk");ta.removeAttribute("readonly");const v=prompt("Paste your backup text");if(!v)return;try{const o=JSON.parse(v);if(!o.sessions)throw 0;DB={...DB,...o};save();toast("Restored");render()}catch{toast("Not a valid backup")}}
  else if(d.act==="wipe"){if(confirm("Delete every session, day and measurement?")){DB={sessions:[],days:{},weekly:[],targets:DB.targets,draft:null,lastDay:null,protein:{},ptarget:DB.ptarget,phit:DB.phit,ver:3};W=newWorkout(ORDER[0]);save();render()}}
});
document.addEventListener("input",e=>{const d=e.target.dataset;
  if(d.in){const day=PLAN.find(x=>x.id===W.day),ex=day.ex[d.i];W.ex[ex.n].sets[d.j][d.in]=e.target.value.trim();e.target.parentElement.classList.toggle("empty",e.target.value.trim()==="");draft()}
  if(e.target.id==="wnote"){W.note=e.target.value;draft()}
});
document.addEventListener("change",e=>{const d=e.target.dataset;
  if(d.dnote!==undefined){const v=DB.days[selDay]=DB.days[selDay]||{};v.note=e.target.value;save()}
  if(d.tgt){DB.targets[d.tgt]=Number(e.target.value)||0;save();render()}
  if(d.ptgt){const v=Math.round(Number(e.target.value));if(v>0){DB[d.ptgt]=v;if(DB.phit>DB.ptarget)DB.phit=DB.ptarget;Object.keys(DB.protein).forEach(pSync);save()}render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pcus"){e.preventDefault();pAdd(pDay,e.target.value.trim())}});
let lastSeen=today();
document.addEventListener("visibilitychange",()=>{if(!document.hidden){keepAwake();if(today()!==lastSeen){if(pDay===lastSeen)pDay=today();if(selDay===lastSeen)selDay=today();lastSeen=today()}if(tab==="log"||tab==="prot")render()}});
render();
</script>
</body>
